<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu & QR Order</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{font:16px system-ui;margin:0;background:#f5f7f5;color:#18251e}.wrap{max-width:650px;margin:auto;padding:16px}.card{background:white;border:1px solid #dce5de;border-radius:14px;padding:16px;margin:12px 0}button{background:#176b45;color:white;border:0;padding:11px 14px;border-radius:9px;font-weight:bold}input,select,textarea{width:100%;padding:11px;border:1px solid #dce5de;border-radius:9px;margin:5px 0 12px;box-sizing:border-box}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.muted{color:#65736a;font-size:13px}h1{margin-bottom:4px}</style></head><body><div class="wrap"><h1>🍗 Menu Kami</h1><div class="muted">Pilih makanan dan hantar pesanan terus ke dapur.</div>
<div id="config" class="card"><b>Sambungan sistem</b><p class="muted">Masukkan URL dan anon key Supabase sekali sahaja pada peranti ini.</p><input id="url" placeholder="Supabase Project URL"><input id="key" placeholder="Supabase anon public key"><button onclick="saveConfig()">Sambung</button></div>
<div id="main" class="card" style="display:none"><label>Jenis pesanan</label><select id="type"><option value="dine_in">Dine-in</option><option value="takeaway">Takeaway</option></select><label>Nombor meja (jika dine-in)</label><input id="table" placeholder="Contoh: 03"><div id="menu"></div><h3>Jumlah: <span id="total">RM0.00</span></h3><label>Nama pelanggan</label><input id="name" placeholder="Nama / nombor panggilan"><label>Nota</label><textarea id="note" placeholder="Contoh: kurang pedas"></textarea><label>Bayaran</label><select id="pay"><option value="cash">Tunai di kaunter</option><option value="qr">QR DuitNow</option></select><button onclick="sendOrder()">Hantar pesanan</button><div id="result"></div></div></div>
<script>
let db,items=[],cart={};const $=x=>document.getElementById(x);const rm=n=>'RM'+Number(n||0).toFixed(2);
function saveConfig(){localStorage.setItem('qr_sb_url',$('url').value.trim());localStorage.setItem('qr_sb_key',$('key').value.trim());start()}
async function start(){let u=localStorage.getItem('qr_sb_url'),k=localStorage.getItem('qr_sb_key');if(!u||!k){$('config').style.display='block';return}db=supabase.createClient(u,k);$('config').style.display='none';$('main').style.display='block';let {data,error}=await db.from('menu_items').select('*').eq('active',true).order('category');if(error){$('menu').textContent=error.message;return}items=data||[];render()}
function render(){$('menu').innerHTML=items.map(i=>`<div class="item"><div><b>${i.name}</b><div class="muted">${i.category||''} · ${rm(i.price)}</div></div><div><button onclick="qty('${i.id}',-1)">−</button> <b id="q${i.id}">${cart[i.id]||0}</b> <button onclick="qty('${i.id}',1)">+</button></div></div>`).join('')||'Menu belum tersedia.';calc()}
function qty(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);$('q'+id).textContent=cart[id];calc()}
function calc(){$('total').textContent=rm(items.reduce((s,i)=>s+(cart[i.id]||0)*Number(i.price),0))}
async function sendOrder(){let chosen=items.filter(i=>(cart[i.id]||0)>0);if(!chosen.length)return alert('Pilih menu dahulu.');let total=chosen.reduce((s,i)=>s+(cart[i.id]||0)*Number(i.price),0),method=$('pay').value;let {data,error}=await db.from('orders').insert({order_type:$('type').value,table_no:$('table').value||null,customer_name:$('name').value||null,customer_note:$('note').value||null,payment_method:method,payment_status:'pending',status:'new',total}).select().single();if(error)return alert(error.message);let lines=chosen.map(i=>({order_id:data.id,menu_item_id:i.id,item_name:i.name,unit_price:i.price,quantity:cart[i.id],line_total:Number(i.price)*cart[i.id]}));let r=await db.from('order_items').insert(lines);if(r.error)return alert('Order diterima tetapi item gagal disimpan. Hubungi pekerja.');$('result').innerHTML=`<h3>Pesanan ${data.order_no} diterima.</h3><p>Jumlah ${rm(total)}.</p><p>${method==='qr'?'Sila buat bayaran QR dan tunjukkan bukti kepada cashier. Pesanan hanya dikira berbayar selepas cashier mengesahkan transaksi bank.':'Sila buat bayaran tunai di kaunter.'}</p>`;cart={};render()}
start();
</script></body></html>
